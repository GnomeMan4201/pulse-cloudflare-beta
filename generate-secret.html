<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Generate SESSION_SECRET</title></head>
<body style="font-family:-apple-system,sans-serif;padding:24px;max-width:480px;margin:0 auto;background:#182019;color:#eee">
<h2>Pulse: generate a SESSION_SECRET</h2>
<p>Tap the button. Copy the value into Cloudflare Pages → Settings → Environment variables → <code>SESSION_SECRET</code>. Nothing here is sent anywhere — it runs only in this page.</p>
<button onclick="go()" style="padding:12px 20px;border-radius:10px;border:none;background:#3fbf6b;color:#06210f;font-weight:700;font-size:16px">Generate</button>
<pre id="out" style="word-break:break-all;white-space:pre-wrap;background:#0e1310;padding:14px;border-radius:10px;margin-top:16px"></pre>
<script>
function go(){
  const bytes = crypto.getRandomValues(new Uint8Array(32));
  let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b));
  document.getElementById('out').textContent = btoa(bin);
}
</script>
</body></html>
